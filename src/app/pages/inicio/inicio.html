<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="hero">
        <div class="hero-content">
            <h1>El sabor que amas, <br><span>el bienestar que necesitas</span></h1>
            <p>Hamburguesas gourmet creadas con ingredientes reales, frescos y equilibrados ¡De la parrilla a tu puerta!
            </p>

            <div class="menu-card">
            </div>

        </div>
    </section>

    <div class="container mt-5">
        <h2 class="text-center text-warning">Inicia sesión para pedir</h2>

        <div *ngIf="error" class="alert alert-danger">
            {{ error }}
        </div>

        <form (ngSubmit)="login()">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" [(ngModel)]="usuario" name="usuario">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" [(ngModel)]="password" name="password">
            </div>

            <button type="submit" class="btn btn-warning w-100">Ingresar</button>
        </form>
    </div>

</body>

</html>
